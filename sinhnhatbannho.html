<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <style>
        body { margin: 0; overflow: hidden; background: black; font-family: 'Arial', sans-serif; }
        canvas { display: block; }
        .content {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: #ff3366;
            text-shadow: 0 0 10px #ff3366, 0 0 20px #ff3366; z-index: 10;
        }
        #text-display { font-size: 4rem; white-space: pre-line; transition: all 0.5s; }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div class="content"><h1 id="text-display"></h1></div>
    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff3366";
            ctx.font = fontSize + "px arial";
            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }

        const textDisplay = document.getElementById('text-display');
        const messages = ["3", "2", "1", "Happy Birthday", "Bạn Nhỏ :3", "02.01.2008", "Happy 18+", "❤️"];
        let messageIndex = 0;

        function updateText() {
            if (messageIndex < messages.length) {
                textDisplay.innerText = messages[messageIndex];
                messageIndex++;
                setTimeout(updateText, 1500);
            }
        }

        setInterval(drawMatrix, 35);
        updateText();
    </script>
</body>
</html>
